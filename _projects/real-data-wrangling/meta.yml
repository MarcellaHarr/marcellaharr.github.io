title: Real World Data Wrangling
date: February 8 – April 6, 2026
category: Python · Data Wrangling
description: A data-wrangling project that gathers, assesses, and cleans four disparate datasets, law enforcement locations, homicide records, weather data, and geographic references, to explore how homicide rates relate to policing presence, weather, and victim demographics.
github_url: https://github.com/MarcellaHarr/real-world_data_wrangling

repo_page: education.html

thumbnail: datawranglingLogo.jpg

